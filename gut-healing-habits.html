<!DOCTYPE html>
<html lang="en">
<head>
<base href="https://healthykitchen.delivery/" />
<meta name="robots" content="noindex,nofollow" />
<link rel="preconnect" href="https://unpkg.com" crossorigin />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gut Healing Habits | Healthy Kitchen</title>
<meta name="description" content="Small daily rituals for a calmer gut, with advice from the doctors at our partner clinic, Maison Santé. Healthy Kitchen, Dubai." />
<link rel="icon" href="assets/brand/healthy-kitchen-logo.png" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="responsive.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--bg-page); }
  image-slot { border-radius: var(--radius-lg); }
  /* S2/S3: #hk-prerender carries genuine static body content (a real element,
     not a script-hidden fallback tag) so non-JS crawlers/curl see real markup.
     F02 (14 Sep 2026): .js is added to the html element only once the React
     application has committed its first render (a layout effect in the mount
     script, before that frame paints), so the static content stays usable
     until the app is actually on screen. If React, ReactDOM, Babel or an
     application script fails to load, or the root render throws, the class
     is never added (or is removed by the root boundary) and the static
     content, with its contact link, remains. A JS-disabled browser never
     gets the class, so the rule never matches and the static content
     renders normally.
     BOOT SEQUENCING (15 Sep 2026): hk-booting is added synchronously by the
     head script below while a boot is in progress, so a healthy load never
     paints the static content at all; the head script removes it again the
     moment the boot demonstrably fails (or after its watchdog), and the
     mount script removes it at the first commit. */
  .hk-booting #hk-prerender, .js #hk-prerender { display: none; }
  /* T-CONSENT: minimal, non-blocking cookie-consent banner. Fixed bottom bar,
     shown only until an explicit choice is stored; never covers more than a
     thin strip so it never blocks reading, the calculator, cart or checkout. */
  #hk-consent-banner {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center; gap: var(--space-5);
    flex-wrap: wrap; padding: var(--space-4) var(--space-5);
    background: var(--green-900); color: var(--white);
    box-shadow: var(--shadow-lg); font-family: var(--font-body);
  }
  #hk-consent-text { margin: 0; max-width: 60ch; font-size: 0.875rem; line-height: 1.5; color: var(--white); }
  #hk-consent-actions { display: flex; gap: var(--space-3); flex-wrap: wrap; }
  #hk-consent-banner button {
    font-family: var(--font-body); font-size: 0.875rem; cursor: pointer;
    padding: var(--space-2) var(--space-5); border-radius: var(--radius-pill); border: 1px solid var(--white);
  }
  #hk-consent-accept { background: var(--white); color: var(--green-900); }
  #hk-consent-reject { background: transparent; color: var(--white); }
  @media (max-width: 640px) {
    #hk-consent-banner { justify-content: flex-start; text-align: left; }
    #hk-consent-actions { width: 100%; }
    #hk-consent-actions button { flex: 1 1 auto; }
  }
</style>
<script>
  // BOOT SEQUENCING (15 Sep 2026): while a healthy boot is in progress the
  // static #hk-prerender is kept off screen (hk-booting on <html>, set here
  // synchronously, before first paint), so a normal load never shows the raw
  // fallback before the application paints. It is put back the moment the
  // boot demonstrably fails - a boot script that cannot load, an uncaught
  // error while booting, a root render that throws (mount script) - and, as
  // a last resort, when no first commit has happened within the watchdog
  // deadline. F02 is unchanged in substance: a real failure still ends with
  // the static content on screen; only a healthy load no longer exposes it.
  // A JS-disabled browser never runs this, so the static content renders
  // normally there.
  (function () {
    var html = document.documentElement;
    var BOOT_WATCHDOG_MS = 8000;
    html.classList.add("hk-booting");
    function booted() { return html.classList.contains("js"); }
    function reveal() { html.classList.remove("hk-booting"); }
    window.HK_BOOT_REVEAL = reveal;
    // Critical boot dependencies only: this site's own scripts and the pinned
    // React, ReactDOM and Babel builds. A tag manager, analytics or any other
    // third-party script (including a muted cross-origin error, which carries
    // no file name) never reveals the fallback; the watchdog still covers
    // everything else (15 Sep 2026 audit).
    function critical(url) {
      url = String(url || "");
      return url.indexOf(location.origin + "/") === 0 ||
        /^https:\/\/unpkg\.com\/(react@|react-dom@|@babel\/standalone@)/.test(url);
    }
    window.addEventListener("error", function (event) {
      if (booted()) return;
      var target = event.target;
      if (target && target !== window) {
        // A resource that failed to load: only a critical boot script matters.
        if (target.tagName === "SCRIPT" && critical(target.src)) reveal();
        return;
      }
      // An uncaught exception while booting, from this page's own scripts or
      // the pinned runtime (Babel reports a page script it could not load
      // this way).
      if (critical(event.filename)) reveal();
    }, true);
    setTimeout(function () { if (!booted()) reveal(); }, BOOT_WATCHDOG_MS);
  })();
</script>
</head>
<body data-route-path="/">
<div id="root"></div>
<div id="hk-prerender"></div>

<script>
window.HK_ASSET_BASE = "";
(function () {
  const whatsappUrl = "https://wa.me/971585129792";
  const allowedLocations = Object.freeze({
    "general-enquiry": "about",
    "consultation-booking": "consultations",
    "intolerance-testing-booking": "intolerance-testing",
    "programme-enquiry": "programme-detail",
  });
  const pageIdPattern = /^[a-z0-9]+(?:-[a-z0-9]+)*$/;
  const programmes = new Set(["longevity", "gut-healing", "autoimmune", "low-fodmap", "muscle-up", "anticandida", "easy-detox", "detox-cleanse"]);
  const mealConfigurations = new Set(["full", "am", "pm", "main"]);
  const calorieBands = new Set(["800–1000", "900–1100", "1000–1200", "1100–1300", "1200–1400", "1200–1500", "1300–1500", "1400–1500", "1500–1600", "1600–1800", "1900–2200"]);
  // Every orderable day count: the cart's authoritative range is
  // min(3, smallest reference duration)..31 (duration-slabs.ts cartDayRange;
  // Detox & Cleanse references 1-3 days), so tracking accepts 1..31 (T6).
  const durations = new Set(Array.from({ length: 31 }, (_, index) => index + 1));

  function pushEvent(event, params, options) {
    if (window.HK_ANALYTICS_ENABLED !== true) return false;
    try {
      if (!Array.isArray(window.dataLayer)) window.dataLayer = [];
      // _clear:true resets GTM's merged model so an items/ecommerce block from
      // one event never leaks into the next (T5). Applied to every ecommerce push.
      const payload = options && options.clear ? { event, _clear: true } : { event };
      Object.keys(params || {}).forEach(function (k) { payload[k] = params[k]; });
      window.dataLayer.push(Object.freeze(payload));
      return true;
    } catch (_error) {
      return false;
    }
  }

  function safePageId(value) {
    return typeof value === "string" && value.length <= 120 && pageIdPattern.test(value);
  }

  function trackLandingPage(pageId) {
    return safePageId(pageId) && pushEvent("landing_page_view", { page_id: pageId });
  }

  function trackBlogView(articleSlug) {
    return safePageId(articleSlug) && pushEvent("blog_view", { article_slug: articleSlug, content_group: "blog" });
  }

  function trackCalculatorStart(pageId) {
    return safePageId(pageId) && programmes.has(pageId) &&
      pushEvent("calculator_start", { page_id: pageId, programme: pageId });
  }

  // Deduped per session by a hash of the selection, so it fires once per
  // distinct valid configuration rather than on every control change.
  const seenCalculatorSelections = new Set();
  function trackCalculatorCompletion(pageId, selection, valueMinor) {
    if (!safePageId(pageId) || !selection || !programmes.has(pageId) ||
        selection.programme !== pageId || !mealConfigurations.has(selection.mealConfiguration) ||
        !calorieBands.has(selection.calorieBand) || !durations.has(selection.durationDays)) return false;
    const hash = pageId + "|" + selection.mealConfiguration + "|" + selection.calorieBand + "|" + selection.durationDays;
    if (seenCalculatorSelections.has(hash)) return false;
    seenCalculatorSelections.add(hash);
    return pushEvent("calculator_completion", {
      page_id: pageId,
      programme: selection.programme,
      meal_configuration: selection.mealConfiguration,
      calorie_band: selection.calorieBand,
      duration_days: selection.durationDays,
      ...(money(valueMinor) !== null ? { value: money(valueMinor) } : {}),
    });
  }

  // First-touch attribution: capture utm_source / utm_campaign / page_id once
  // into sessionStorage so wa.me traffic (otherwise unattributable) can carry it.
  const CTA_POSITION_WHITELIST = new Set(["hero", "mid", "footer", "sticky", "nav"]);
  (function captureFirstTouch() {
    try {
      if (sessionStorage.getItem("hk_first_touch")) return;
      const q = new URLSearchParams(location.search);
      const ft = {
        utm_source: (q.get("utm_source") || "").slice(0, 60),
        utm_campaign: (q.get("utm_campaign") || "").slice(0, 60),
        page_id: (location.pathname || "/").slice(0, 120),
      };
      sessionStorage.setItem("hk_first_touch", JSON.stringify(ft));
    } catch (_error) { /* storage unavailable */ }
  })();
  // Non-customer-visible attribution only: read once, attach to the GTM
  // dataLayer events below. Never appended to the WhatsApp message text a
  // customer actually sees (25 Sep 2026, customer-experience fix) - wa.me
  // traffic remains attributable through these dataLayer fields instead.
  function firstTouchAttribution() {
    try {
      const ft = JSON.parse(sessionStorage.getItem("hk_first_touch") || "{}");
      const attribution = {};
      if (ft.utm_source) attribution.utm_source = ft.utm_source;
      if (ft.utm_campaign) attribution.utm_campaign = ft.utm_campaign;
      return attribution;
    } catch (_error) { return {}; }
  }
  // The exact display name each plan's page uses (window.HK_PLANS, from
  // data.js). Falls back to the generic message below if a plan isn't found
  // (data.js not yet loaded, or pageId isn't a plan slug).
  function planDisplayName(pageId) {
    const plans = Array.isArray(window.HK_PLANS) ? window.HK_PLANS : [];
    const plan = plans.find(function (candidate) { return candidate && candidate.slug === pageId; });
    return plan && typeof plan.name === "string" ? plan.name : null;
  }
  function whatsAppMessageText(input) {
    if (input.intent === "programme-enquiry") {
      const name = planDisplayName(input.pageId);
      if (name) {
        return "Hi Healthy Kitchen 👋\n\nI’m interested in your " + name +
          " and would like to know more about the plan, pricing and delivery options.";
      }
    }
    return "Hi Healthy Kitchen 👋\n\nI’m interested in your meal plans and would like some more " +
      "information about the available programmes, pricing and delivery options.";
  }
  function openWhatsApp(input) {
    if (!input || allowedLocations[input.intent] !== input.ctaLocation ||
        !safePageId(input.pageId)) return false;
    // cta_location prefers an explicit position (hero|mid|footer|sticky|nav) so
    // the several CTAs on a page no longer all report the same location.
    const location_ = (typeof input.position === "string" && CTA_POSITION_WHITELIST.has(input.position))
      ? input.position : input.ctaLocation;
    const attribution = firstTouchAttribution();
    pushEvent("whatsapp_handoff", Object.assign({ whatsapp_intent: input.intent, cta_location: location_, page_id: input.pageId }, attribution));
    // generate_lead is the brief's Meta Lead signal for a WhatsApp hand-off.
    pushEvent("generate_lead", Object.assign({ whatsapp_intent: input.intent, cta_location: location_, page_id: input.pageId, lead_type: "whatsapp" }, attribution));
    const url = whatsappUrl + (whatsappUrl.indexOf("?") === -1 ? "?text=" : "&text=")
      + encodeURIComponent(whatsAppMessageText(input));
    const opened = window.open(url, "_blank", "noopener,noreferrer");
    if (opened) opened.opener = null;
    return true;
  }

  // ---- GA4/Meta dataLayer tracking (default-off, runtime-flag gated) --------
  // GTM-NCHWZCT3 is loaded and the dataLayer enabled ONLY when the deployment
  // sets window.HK_RUNTIME_FLAGS.trackingEnabled === true (a consented,
  // tracking-approved deployment). With the flag absent the site behaves
  // exactly as before: no GTM request and every push below is a no-op, because
  // pushEvent returns early while HK_ANALYTICS_ENABLED !== true. GTM is the only
  // delivery layer — GA4 and Meta are never embedded in this file. No PII is
  // ever pushed: only programme/plan/selection identifiers and money.
  const trackingEnabled = !!(window.HK_RUNTIME_FLAGS && window.HK_RUNTIME_FLAGS.trackingEnabled === true);
  // An explicit true set before this script runs (e.g. a test's addInitScript,
  // or any future consent/init step) is a deliberate opt-in and must survive -
  // this bootstrap only ever ADDS the GTM-driven enablement, never removes an
  // enablement someone else already granted. Default (untouched) behavior is
  // unchanged: HK_ANALYTICS_ENABLED starts undefined, so this is exactly
  // trackingEnabled, same as before.
  window.HK_ANALYTICS_ENABLED = window.HK_ANALYTICS_ENABLED === true || trackingEnabled;
  const GTM_CONTAINER_ID = "GTM-NCHWZCT3";
  // T-CONSENT: Google Consent Mode v2, region-aware (post-release hardening,
  // 15 Sep 2026). Loading the GTM container is not itself measurement, so it
  // still loads whenever this deployment has tracking enabled. The default is
  // DENIED for visitors in the EEA, the UK and Switzerland (Google applies the
  // region-scoped default by the visitor's location, and a region-scoped
  // default always wins over the global one) and GRANTED elsewhere - the
  // site's audience is UAE-centric. Google tags honour the consent state
  // natively; the Meta tags in the container must require ad_storage (see
  // docs/tracking/GTM_RUNBOOK.md). A stored explicit choice - accept or reject
  // - is re-applied immediately in every region, so returning visitors are
  // never re-prompted and never lose the choice they already made.
  const CONSENT_STORAGE_KEY = "hk_consent_choice";
  const CONSENT_FIELDS = ["ad_storage", "ad_user_data", "ad_personalization", "analytics_storage"];
  const CONSENT_REQUIRED_REGIONS = [
    "AT", "BE", "BG", "CY", "CZ", "DE", "DK", "EE", "ES", "FI", "FR", "GR", "HR", "HU", "IE", "IT", "LT", "LU", "LV", "MT", "NL", "PL", "PT", "RO", "SE", "SI", "SK",
    "IS", "LI", "NO",
    "GB",
    "CH",
  ];
  function consentState(granted) {
    const state = {};
    CONSENT_FIELDS.forEach(function (field) { state[field] = granted ? "granted" : "denied"; });
    return state;
  }
  function readStoredConsent() {
    try {
      const value = localStorage.getItem(CONSENT_STORAGE_KEY);
      return value === "granted" || value === "rejected" ? value : null;
    } catch (_error) { return null; }
  }
  function storeConsent(value) {
    try { localStorage.setItem(CONSENT_STORAGE_KEY, value); } catch (_error) { /* best effort */ }
  }
  window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
  if (trackingEnabled) {
    window.dataLayer = window.dataLayer || [];
    // Consent defaults must be pushed before gtm.js is requested below, so the
    // container never has a window where consent is unset. Region-scoped
    // default first, then the global default.
    const regionDefault = consentState(false);
    regionDefault.region = CONSENT_REQUIRED_REGIONS;
    regionDefault.wait_for_update = 500;
    window.gtag("consent", "default", regionDefault);
    window.gtag("consent", "default", consentState(true));
    const storedConsent = readStoredConsent();
    if (storedConsent === "granted") window.gtag("consent", "update", consentState(true));
    if (storedConsent === "rejected") window.gtag("consent", "update", consentState(false));
  }
  // A dataLayer event on an explicit choice, so container tags gated on
  // ad_storage (Meta) can fire on the page where consent was granted instead
  // of only from the next page load.
  function announceConsent(granted) {
    try { window.dataLayer.push({ event: "hk_consent_update", hk_consent: granted ? "granted" : "denied" }); } catch (_error) { /* best effort */ }
  }
  if (trackingEnabled && !window.HK_GTM_LOADED) {
    window.HK_GTM_LOADED = true;
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({ "gtm.start": Date.now(), event: "gtm.js" });
    const firstScript = document.getElementsByTagName("script")[0];
    const gtmScript = document.createElement("script");
    gtmScript.async = true;
    gtmScript.src = "https://www.googletagmanager.com/gtm.js?id=" + GTM_CONTAINER_ID;
    firstScript.parentNode.insertBefore(gtmScript, firstScript);
  }
  // Minimal, non-blocking consent banner: only for deployments where tracking
  // exists at all, and only until the visitor has made an explicit choice.
  // Rendered outside #root as a plain DOM node so it survives every SPA route
  // change untouched and is never re-prompted mid-session.
  function hideConsentBanner(banner) {
    if (banner && banner.parentNode) banner.parentNode.removeChild(banner);
  }
  function showConsentBanner() {
    const banner = document.createElement("div");
    banner.id = "hk-consent-banner";
    banner.setAttribute("role", "region");
    banner.setAttribute("aria-label", "Cookie consent");
    const text = document.createElement("p");
    text.id = "hk-consent-text";
    text.textContent = "We use cookies to understand how our site is used and to improve your experience. "
      + "You can accept analytics/marketing cookies or reject non-essential ones.";
    const actions = document.createElement("div");
    actions.id = "hk-consent-actions";
    const rejectButton = document.createElement("button");
    rejectButton.type = "button";
    rejectButton.id = "hk-consent-reject";
    rejectButton.textContent = "Reject non-essential";
    const acceptButton = document.createElement("button");
    acceptButton.type = "button";
    acceptButton.id = "hk-consent-accept";
    acceptButton.textContent = "Accept analytics/marketing";
    actions.appendChild(rejectButton);
    actions.appendChild(acceptButton);
    banner.appendChild(text);
    banner.appendChild(actions);
    document.body.appendChild(banner);
    acceptButton.addEventListener("click", function () {
      window.gtag("consent", "update", consentState(true));
      storeConsent("granted");
      announceConsent(true);
      hideConsentBanner(banner);
    });
    rejectButton.addEventListener("click", function () {
      window.gtag("consent", "update", consentState(false));
      storeConsent("rejected");
      announceConsent(false);
      hideConsentBanner(banner);
    });
  }
  if (trackingEnabled && readStoredConsent() === null) {
    showConsentBanner();
  }

  const trackingCurrency = "AED";
  const CTA_POSITIONS = new Set(["hero", "mid", "footer", "sticky", "nav"]);
  function money(minor) {
    return typeof minor === "number" && Number.isSafeInteger(minor) && minor >= 0 ? Math.round(minor) / 100 : null;
  }
  function safeText(value, max) {
    return typeof value === "string" && value.length <= (max || 120) ? value : undefined;
  }
  // Canonical GA4 item — reuses the cart/quote line. price is per day and
  // quantity is the number of days, so price x quantity = the quoted subtotal.
  // Never a hardcoded price; the caller passes perDayMinor from /api/quote.
  function buildItem(programme, selection, perDayMinor, name) {
    if (!programmes.has(programme)) return null;
    const item = { item_id: programme, item_name: safeText(name, 80) || programme, item_category: "meal_plan", item_category2: programme };
    if (selection && mealConfigurations.has(selection.mealConfiguration) &&
        calorieBands.has(selection.calorieBand) && durations.has(selection.durationDays)) {
      item.item_variant = selection.mealConfiguration + "|" + selection.calorieBand + "|" + selection.durationDays + "d";
      item.quantity = selection.durationDays;
      const per = money(perDayMinor);
      if (per !== null) item.price = per;
    }
    return item;
  }
  // Every ecommerce push: currency AED, value = subtotal - discount EXCLUDING
  // the refundable deposit; deposit_amount and discount_amount are separate.
  function ecom(event, opts) {
    opts = opts || {};
    const params = { currency: trackingCurrency };
    if (Array.isArray(opts.items) && opts.items.length) params.items = opts.items;
    const value = money(opts.valueMinor);
    if (value !== null) params.value = value;
    const deposit = money(opts.depositMinor);
    if (deposit !== null && deposit > 0) params.deposit_amount = deposit;
    const discount = money(opts.discountMinor);
    if (discount !== null && discount > 0) params.discount_amount = discount;
    if (opts.extra) Object.keys(opts.extra).forEach(function (k) { if (opts.extra[k] !== undefined) params[k] = opts.extra[k]; });
    return pushEvent(event, params, { clear: true });
  }
  function trackPageView(input) {
    input = input || {};
    return pushEvent("page_view", {
      ...(safeText(input.page_path, 512) ? { page_path: input.page_path } : {}),
      ...(safeText(input.page_title, 300) ? { page_title: input.page_title } : {}),
      ...(safePageId(input.page_id) ? { page_id: input.page_id } : { page_id: null }),
      ...(safeText(input.route_name, 40) ? { route_name: input.route_name } : {}),
    });
  }
  function trackViewItem(programme, name, perDayMinor, selection, valueMinor) {
    const item = buildItem(programme, selection, perDayMinor, name);
    if (!item) return false;
    return ecom("view_item", { items: [item], valueMinor, extra: { programme } });
  }
  function trackAddToCart(line) {
    line = line || {};
    const item = buildItem(line.programme, line.selection, line.perDayMinor, line.name);
    if (!item) return false;
    return ecom("add_to_cart", { items: [item], valueMinor: line.valueMinor, depositMinor: line.depositMinor });
  }
  function itemsFromLines(lines) {
    return (Array.isArray(lines) ? lines : []).map(function (l) {
      return buildItem(l.programme, l.selection, l.perDayMinor, l.name);
    }).filter(Boolean);
  }
  function trackViewCart(lines, valueMinor) {
    return ecom("view_cart", { items: itemsFromLines(lines), valueMinor });
  }
  function trackRemoveFromCart(lines, valueMinor) {
    return ecom("remove_from_cart", { items: itemsFromLines(lines), valueMinor });
  }
  function trackBeginCheckout(lines, valueMinor, depositMinor) {
    return ecom("begin_checkout", { items: itemsFromLines(lines), valueMinor, depositMinor });
  }
  function trackPromo(applied, info) {
    info = info || {};
    return pushEvent(applied ? "promo_applied" : "promo_rejected", {
      ...(safeText(info.promo_code, 40) ? { promo_code: info.promo_code } : {}),
      ...(money(info.discountMinor) !== null ? { discount_amount: money(info.discountMinor) } : {}),
      ...(safeText(info.reject_reason, 60) ? { reject_reason: info.reject_reason } : {}),
    });
  }
  function trackShippingInfo(lines, valueMinor, area, slot) {
    return ecom("add_shipping_info", { items: itemsFromLines(lines), valueMinor,
      extra: { ...(safeText(area, 60) ? { delivery_area: area } : {}), ...(safeText(slot, 60) ? { delivery_slot: slot } : {}) } });
  }
  function trackPaymentInfo(lines, valueMinor, paymentType, eventId) {
    return ecom("add_payment_info", { items: itemsFromLines(lines), valueMinor,
      extra: { ...(safeText(paymentType, 40) ? { payment_type: paymentType } : {}), ...(safeText(eventId, 128) ? { event_id: eventId } : {}) } });
  }
  const PURCHASE_KEY_PREFIX = "hk_purchase_tracked:";
  function purchaseAlreadyTracked(transactionId) {
    // Session storage covers refresh and re-poll in the tab; local storage
    // (post-release hardening, 15 Sep 2026) covers the same return URL opened
    // in a second tab. Either marker suppresses the push.
    try { if (sessionStorage.getItem(PURCHASE_KEY_PREFIX + transactionId) === "1") return true; } catch (_error) { /* unavailable storage is not a marker */ }
    try { return localStorage.getItem(PURCHASE_KEY_PREFIX + transactionId) === "1"; } catch (_error) { return false; }
  }
  // T7 user_id: SHA-256 (hex) of the customer's contact number, normalised to
  // international digits (no "+", a leading "00" dropped, a UAE local
  // 0XXXXXXXXX becomes 971XXXXXXXXX). Computed after the checkout request
  // succeeded and kept only as the hash, per merchant reference, in this tab's
  // session; the raw number never enters the dataLayer or storage. Fire and
  // forget: any failure (no WebCrypto, storage blocked) just omits user_id.
  const USER_HASH_KEY_PREFIX = "hk_purchase_uid:";
  const HASH_PATTERN = /^[a-f0-9]{64}$/;
  function normaliseContactNumber(value) {
    if (typeof value !== "string") return null;
    let digits = value.replace(/\D/g, "");
    if (digits.indexOf("00") === 0) digits = digits.slice(2);
    if (digits.length === 10 && digits.charAt(0) === "0") digits = "971" + digits.slice(1);
    return digits.length >= 8 && digits.length <= 15 ? digits : null;
  }
  function rememberPurchaseUser(transactionId, contactNumber) {
    try {
      if (window.HK_ANALYTICS_ENABLED !== true) return false;
      if (typeof transactionId !== "string" || !/^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$/.test(transactionId)) return false;
      const digits = normaliseContactNumber(contactNumber);
      const subtle = window.crypto && window.crypto.subtle;
      if (digits === null || !subtle || typeof TextEncoder !== "function") return false;
      subtle.digest("SHA-256", new TextEncoder().encode(digits)).then(function (buffer) {
        const hex = Array.from(new Uint8Array(buffer), function (b) { return b.toString(16).padStart(2, "0"); }).join("");
        try { sessionStorage.setItem(USER_HASH_KEY_PREFIX + transactionId, hex); } catch (_error) { /* best effort */ }
      }, function () { /* hashing unavailable: purchase is sent without user_id */ });
      return true;
    } catch (_error) {
      return false;
    }
  }
  function purchaseUserId(transactionId) {
    try {
      const stored = sessionStorage.getItem(USER_HASH_KEY_PREFIX + transactionId);
      return typeof stored === "string" && HASH_PATTERN.test(stored) ? stored : null;
    } catch (_error) {
      return null;
    }
  }
  // Fire ONLY from the durable /api/payments/status "paid" read-back, exactly
  // once per transaction (deduped by session and local storage on the merchant reference).
  // value EXCLUDES the refundable deposit (net). event_id = purchase_<ref> so
  // the browser event dedupes against the future server-side CAPI event (T8).
  function trackPurchase(input) {
    input = input || {};
    if (typeof input.transactionId !== "string" ||
        !/^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$/.test(input.transactionId)) return false;
    if (input.paymentState !== "paid") return false;
    const value = money(input.netAmountMinor !== undefined ? input.netAmountMinor : input.valueMinor);
    if (value === null || value <= 0) return false;
    if (purchaseAlreadyTracked(input.transactionId)) return false;
    try { sessionStorage.setItem(PURCHASE_KEY_PREFIX + input.transactionId, "1"); } catch (_error) { /* best effort */ }
    try { localStorage.setItem(PURCHASE_KEY_PREFIX + input.transactionId, "1"); } catch (_error) { /* best effort */ }
    return ecom("purchase", {
      items: Array.isArray(input.items) ? input.items : undefined,
      valueMinor: input.netAmountMinor !== undefined ? input.netAmountMinor : input.valueMinor,
      depositMinor: input.depositMinor,
      discountMinor: input.discountMinor,
      extra: {
        transaction_id: input.transactionId,
        event_id: "purchase_" + input.transactionId,
        ...(purchaseUserId(input.transactionId) !== null ? { user_id: purchaseUserId(input.transactionId) } : {}),
        currency: (typeof input.currency === "string" && /^[A-Z]{3}$/.test(input.currency)) ? input.currency : trackingCurrency,
        ...(safeText(input.promo_code, 40) ? { promo_code: input.promo_code } : {}),
      },
    });
  }
  function trackPaymentFailed(transactionId, failureState, valueMinor) {
    return pushEvent("payment_failed", {
      ...(safeText(transactionId, 128) ? { transaction_id: transactionId } : {}),
      ...(safeText(failureState, 40) ? { failure_state: failureState } : {}),
      ...(money(valueMinor) !== null ? { value: money(valueMinor) } : {}),
    });
  }
  function trackGenerateLead(leadType) {
    return pushEvent("generate_lead", { lead_type: safeText(leadType, 40) || "enquiry" });
  }
  function trackFormError(formName, errorField, errorCount) {
    return pushEvent("form_error", {
      form_name: safeText(formName, 40) || "unknown",
      ...(safeText(errorField, 60) ? { error_field: errorField } : {}),
      ...(Number.isSafeInteger(errorCount) ? { error_count: errorCount } : {}),
    });
  }
  function trackApiError(apiEndpoint, httpStatus, errorCode) {
    return pushEvent("api_error", {
      api_endpoint: safeText(apiEndpoint, 80) || "unknown",
      ...(Number.isSafeInteger(httpStatus) ? { http_status: httpStatus } : {}),
      ...(safeText(errorCode, 60) ? { error_code: errorCode } : {}),
    });
  }
  function trackNotFound(pagePath, referrer) {
    return pushEvent("page_not_found", {
      page_path: safeText(pagePath, 512) || (location && location.pathname) || "/",
      ...(safeText(referrer, 512) ? { referrer: referrer } : {}),
    });
  }
  function trackScrollDepth(articleSlug, percent) {
    if (!safePageId(articleSlug) || (percent !== 50 && percent !== 90)) return false;
    return pushEvent("scroll_depth", { article_slug: articleSlug, percent_scrolled: percent });
  }
  function trackSelectContent(contentType, itemId) {
    return pushEvent("select_content", {
      content_type: safeText(contentType, 40) || "link",
      ...(safeText(itemId, 80) ? { item_id: itemId } : {}),
    });
  }

  window.HealthyKitchenIntegrations = Object.freeze({
    openWhatsApp,
    trackBlogView,
    trackCalculatorCompletion,
    trackCalculatorStart,
    trackLandingPage,
    trackPageView,
    trackViewItem,
    trackAddToCart,
    trackViewCart,
    trackRemoveFromCart,
    trackBeginCheckout,
    trackPromo,
    trackShippingInfo,
    trackPaymentInfo,
    trackPurchase,
    rememberPurchaseUser,
    trackPaymentFailed,
    trackGenerateLead,
    trackFormError,
    trackApiError,
    trackNotFound,
    trackScrollDepth,
    trackSelectContent,
    whatsappUrl,
  });
})();
</script>

<!-- T3: initial page_view from the static shell, before React/Babel mounts, so a
     visitor who leaves before hydration still records a session. The app
     suppresses its own first page_view (initial route) to avoid a duplicate. -->
<script>
  // Best effort: a failure inside the analytics facade must never surface as
  // a page error at boot.
  try { if (window.HealthyKitchenIntegrations) {
    window.HealthyKitchenIntegrations.trackPageView({
      page_path: location.pathname,
      page_title: document.title,
      page_id: null,
      route_name: "initial",
    });
  } } catch (_trackingError) { /* tracking never blocks the page */ }
</script>
